<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="简洁高效的书签导航网站，帮助您快速访问常用网站">
  <title>书签导航</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --primary-color: #3498db;
      --secondary-color: #2980b9;
      --accent-color: #e74c3c;
      --background-color: #f5f7fa;
      --card-bg: #ffffff;
      --text-color: #333;
      --shadow: 0 4px 6px rgba(0,0,0,0.08);
      --transition: all 0.3s ease;
      --border-radius: 12px;
      --icon-size: 48px;
      --category-icon-size: 36px;
    }

    /* 暗色模式变量 */
    :root.dark-mode {
      --primary-color: #4da6ff;
      --secondary-color: #0077e6;
      --accent-color: #ff6b6b;
      --background-color: #1a1a2e;
      --card-bg: #16213e;
      --text-color: #e6e6e6;
      --shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.6;
      color: var(--text-color);
      background-color: var(--background-color);
      padding: 10px;
      max-width: 1600px;
      margin: 0 auto;
      transition: background-color 0.3s ease;
    }
    
    /* 导航栏样式 */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      margin-bottom: 6px;
      position: sticky;
      top: 10px;
      z-index: 1000;
    }
    
    .navbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .navbar-title {
      font-size: 1.2em;
      font-weight: 600;
      color: var(--text-color);
    }
    
    .navbar-center {
      flex: 1;
      display: flex;
      justify-content: center;
    }
    
    .search-container {
      position: relative;
      max-width: 500px;
      width: 100%;
    }
    
    .search-box {
      width: 100%;
      padding: 8px 15px 8px 40px;
      border: 1px solid #e0e3e9;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: var(--shadow);
      transition: var(--transition);
      background-color: var(--card-bg);
      color:极 var(--text-color);
    }
    
    .search-box:focus {
      box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
      outline: none;
      border-color: var(--primary-color);
    }
    
    .search-container i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
    }
    
    .navbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    /* 汉堡菜单按钮 */
    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-color);
      outline: none;
    }
    
    /* 移动菜单 */
    .mobile-menu {
      display: none;
      position: fixed;
      top: 65px;
      left: 0;
      right: 0;
      background: var(--card-bg);
      z-index: 999;
      padding: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      border-radius: 0 0 var(--border-radius) var(--border-radius);
    }
    
    .mobile-menu.active {
      display: block;
    }
    
    .mobile-search-container {
      position: relative;
      margin-bottom: 12px;
    }
    
    .mobile-search-box {
      width: 100%;
      padding: 10px 15px 10px 45px;
      border: 1px solid #e0e3e9;
      border-radius: 20px;
      font-size: 14px;
      background-color: var(--card-bg);
      color: var(--text-color);
    }
    
    .mobile-search-container i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
    }
    
    .mobile-theme-toggle {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--text极-color);
      outline: none;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
    }
    
    .mobile-theme-toggle:hover {
      background: rgba(0,0,0,0.05);
    }
    
    /* 分类导航栏 */
    .category-nav {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      position: sticky;
      top: 65px;
      z-index: 900;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    
    .dark-mode .category-nav {
      background: rgba(22, 33, 62, 0.95);
    }
    
    .category-btn {
      padding: 5px 10px;
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      font-weight: 500;
    }
    
    .category-btn:hover, .category-btn.active {
      background: var(--primary-color);
      color: white;
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--primary-color);
    }
    
    .category-btn i {
      font-size: 11px;
    }
    
    /* 暗色模式切换按钮 */
    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--text-color);
      outline: none;
      transition: transform 0.3s ease;
    }
    
    .theme-toggle:hover {
      transform: rotate(15deg) scale(1.1);
    }
    
    .category-section {
      margin-bottom: 24px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 12px 15px;
      box-shadow: var(--shadow);
      transition: var(--transition);
      position: relative;
      border-left: 5px solid;
    }
    
    /* 分类边框颜色 */
    .category-section.search { border-left-color: #3498db; }
    .category-section.social { border-left-color: #e74c3c; }
    .category-section.dev { border-left-color: #2ecc71; }
    .category-section.tools { border-left-color: #f39c12; }
    .category-section.media { border-left-color: #9b59b6; }
    .category-section.news { border-left-color: #e67e22; }
    .category-section.shopping { border-left-color: #d35400; }
    .category-section.education { border-left-color: #27ae60; }
    .category-section.travel { border-left-color: #2980b9; }
    .category-section.finance { border-left-color: #8e44ad; }
    .category-section.health { border-left-color: #16a085; }
    .category-section.food { border-left-color: #c0392b; }
    .category-section.sports { border-left-color: #f1c40f; }
    .category-section.games { border-left-color: #9b59b6; }
    .category-section.art { border-left-color: #e74c3c; }
    .category-section.music { border-left-color: #3498db; }
    .category-section.books { border-left-color: #2ecc71; }
    .category-section.tech { border-left-color: #34495e; }
    .category-section.photography { border-left-color: #d35400; }
    .category-section.design { border-left-color: #9b59b6; }
    
    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }
    
    .dark-mode .category-header {
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .category-title {
      font-size: 1.2em;
      color: var(--text-color);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    
    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
      gap: 15px;
      transition: var(--transition);
    }
    
    .bookmark-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 15px;
      box-shadow: var(--shadow);
      transition: var(--transition);
      display: flex;
      align-items: flex-start;
      min-height: 90px;
      border: 1px solid rgba(0,0,0,0.05);
      text-decoration: none !important;
      overflow: hidden;
      will-change: transform;
      contain: content;
    }
    
    .dark-mode .bookmark-card {
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .bookmark-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.12);
      border-color: rgba(52, 152, 219, 0.3);
    }
    
    .bookmark-icon {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 16px;
      flex-shrink: 0;
      overflow: hidden;
      background: rgba(52, 152, 219, 0.1);
      border: 1px solid rgba(0,0,0,0.05);
      font-weight: bold;
      font-size: 22px;
      color: white;
    }
    
    .bookmark-info {
      flex: 1;
      overflow: hidden;
      min-width: 0;
    }
    
    .bookmark-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text-color);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none !important;
    }
    
    .bookmark-desc {
      color: #666;
      font-size: 13px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
      text-decoration: none !important;
    }
    
    .dark-mode .bookmark-desc {
      color: #aaa;
    }
    
    /* 优化后的返回顶部按钮 */
    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6em;
      cursor: pointer;
      z-index: 200;
      opacity: 0.92;
      transform: translateY(10px);
      animation: pulse 2s infinite;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      backdrop-filter: blur(5px);
      border: none !important;
    }
    
    /* 悬停时缩放和颜色变化 */
    .back-to-top:hover {
      transform: translateY(-3px) scale(1.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      opacity: 1;
      background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
      animation: none;
    }
    
    /* 淡入淡出动画 */
    .back-to-top.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(30px);
    }
    
    /* 脉动动画效果 */
    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(41, 128, 185, 0.5);
      }
      70% {
        box-shadow: 0 0 0 12px rgba(41, 128, 185, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(41, 128, 185, 0);
      }
    }
    
    /* 宽屏布局优化 */
    @media (min-width: 768px) {
      .bookmarks-grid {
        grid-template-columns: repeat(auto-fill, minmax(calc(50% - 10px), 1fr));
      }
      
      .bookmark-card {
        min-height: 90px;
        padding: 16px;
      }
      
      :root {
        --icon-size: 48px;
      }
    }
    
    @media (min-width: 992px) {
      .bookmarks-grid {
        grid-template-columns: repeat(auto-fill, minmax(calc(33.33% - 14px), 1fr));
      }
    }
    
    @media (min-width: 1200px) {
      .bookmarks-grid {
        grid-template-columns: repeat(auto-fill, minmax(calc(25% - 16px), 1fr));
      }
      
      .bookmark-card {
        padding: 15px;
      }
      
      .bookmark-info {
        padding-right: 8px;
      }
    }
    
    @media (min-width: 1600px) {
      .bookmarks-grid {
        grid-template-columns: repeat(auto-fill, minmax(calc(20% - 16px), 1fr));
      }
    }
    
    /* 小屏幕样式 */
    @media (max-width: 768px) {
      body {
        padding: 8px;
      }
      
      .navbar {
        padding: 6px 12px;
        margin-bottom: 4px;
      }
      
      .navbar-center {
        display: none;
      }
      
      .navbar-right .theme-toggle {
        display: none;
      }
      
      .hamburger {
        display: flex;
      }
      
      .category-nav {
        top: 62px;
        padding: 6px;
        margin-bottom: 6px;
      }
      
      .bookmark-icon {
        margin-right: 12px;
      }
    }
    
    @media (max-width: 480px) {
      body {
        padding: 5px;
      }
      
      .navbar {
        padding: 6px 10px;
      }
      
      .navbar-title {
        font-size: 1.1em;
      }
      
      .category-nav {
        top: 58px;
        padding: 4px;
        gap: 3px;
      }
      
      .category-btn {
        padding: 4px 8px;
        font-size: 11px;
      }
      
      /* 小屏幕返回顶部按钮优化 */
      .back-to-top {
        width: 55px;
        height: 55px;
        bottom: 20px;
        right: 20px;
        font-size: 1.4em;
      }
    }
    
    .scroll-target {
      position: relative;
      top: -70px;
      visibility: hidden;
    }
    
    .no-results {
      text-align: center;
      padding: 24px;
      color: #888;
      font-style: italic;
      font-size: 0.9em;
    }
    
    .dark-mode .no-results {
      color: #aaa;
    }
    
    .loading-indicator {
      text-align: center;
      padding: 16px;
      display: none;
      font-size: 0.9em;
    }
    
    .highlight {
      background-color: #fffdd0;
      font-weight: bold;
      padding: 0 2px;
      border-radius: 3px;
      color: #000;
    }
    
    .dark-mode .highlight {
      background-color: #ffec8b;
      color: #000;
    }
    
    .bookmark-card:hover .bookmark-icon {
      transform: scale(1.05);
      transition: var(--transition);
    }
  </style>
</head>

    // 生成书签图标
    function createBookmarkIcon(title) {
      const firstChar = title.charAt(0).toUpperCase();
      const colors = [
        '#3498db', '#e74c3c', '#2ecc71', '#f39c12', 
        '#9b59b6', '#1abc9c', '#d35400', '#16a085'
      ];
      const colorIndex = (firstChar.charCodeAt(0) + title.length) % colors.length;
      const bgColor = colors[colorIndex];
      
      return {
        char: firstChar,
        bgColor: bgColor
      };
    }

    // DOM元素引用
    const bookmarksContainer = document.getElementById('bookmarksContainer');
    const searchInput = document.getElementById('searchInput');
    const mobileSearchInput = document.getElementById('mobileSearchInput');
    const categoryNav = document.getElementById('categoryNav');
    const backToTop = document.getElementById('backToTop');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const themeToggle = document.getElementById('themeToggle');
    const mobileThemeToggle = document.getElementById('mobileThemeToggle');
    const hamburgerMenu = document.getElementById('hamburgerMenu');
    const mobileMenu = document.getElementById('mobileMenu');
    
    // 页面初始化完成标志
    let isInitialized = false;
    let scrollTimer = null;
    
    // 初始化页面
    function initPage() {
      // 初始化主题
      initTheme();
      
      // 渲染分类导航
      renderCategoryNav();
      
      // 渲染书签
      renderBookmarks();
      
      // 添加事件监听器
      searchInput.addEventListener('input', filterBookmarks);
      mobileSearchInput.addEventListener('input', filterBookmarks);
      window.addEventListener('scroll', handleScroll);
      backToTop.addEventListener('click', scrollToTop);
      themeToggle.addEventListener('click', toggleTheme);
      mobileThemeToggle.addEventListener('click', toggleTheme);
      hamburgerMenu.addEventListener('click', toggleMobileMenu);
      
      // 设置默认选中的分类
      if (bookmarksData.categories.length > 0) {
        const firstCategoryBtn = document.querySelector('.category-btn');
        if (firstCategoryBtn) {
          firstCategoryBtn.classList.add('active');
          firstCategoryBtn.setAttribute('aria-selected', 'true');
        }
      }
      
      // 初始化返回顶部按钮
      handleScroll();
      
      isInitialized = true;
    }
    
    // 初始化主题设置
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark-mode');
        themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        themeToggle.setAttribute('aria-label', '切换亮色模式');
        mobileThemeToggle.innerHTML = '<i class="fas fa-sun"></i><span>切换亮色模式</span>';
      } else {
        document.documentElement.classList.remove('dark-mode');
        themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
        themeToggle.setAttribute('aria-label', '切换暗色模式');
        mobileThemeToggle.innerHTML = '<i class="fas fa-moon"></i><span>切换暗色模式</span>';
        localStorage.setItem('theme', 'light');
      }
    }
    
    // 切换主题
    function toggleTheme() {
      const html = document.documentElement;
      const isDarkMode = html.classList.contains('dark-mode');
      
      if (isDarkMode) {
        html.classList.remove('dark-mode');
        themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
        themeToggle.setAttribute('aria-label', '切换暗色模式');
        mobileThemeToggle.innerHTML = '<i class="fas fa-moon"></i><span>切换暗色模式</span>';
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark-mode');
        themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        themeToggle.setAttribute('aria-label', '切换亮色模式');
        mobileThemeToggle.innerHTML = '<i class="fas fa-sun"></i><span>切换亮色模式</span>';
        localStorage.setItem('theme', 'dark');
      }
    }
    
    // 切换移动菜单
    function toggleMobileMenu() {
      mobileMenu.classList.toggle('active');
    }
    
    // 渲染分类导航
    function renderCategoryNav() {
      if (!categoryNav) return;
      
      categoryNav.innerHTML = '';
      
      bookmarksData.categories.forEach(category => {
        const categoryBtn = document.createElement('button');
        categoryBtn.className = 'category-btn';
        
        // 使用Font Awesome图标
        let iconHtml = '';
        if (category.icon) {
          iconHtml = `<i class="${category.icon}" aria-hidden="true"></i>`;
        } else {
          iconHtml = `<i class="fas fa-folder" aria-hidden="true"></i>`;
        }
        
        categoryBtn.innerHTML = `
          ${iconHtml}
          ${category.title}
        `;
        
        categoryBtn.dataset.category = category.id;
        categoryBtn.setAttribute('role', 'tab');
        categoryBtn.setAttribute('aria-selected', 'false');
        
        categoryBtn.addEventListener('click', () => {
          scrollToCategory(category.id);
          
          // 高亮当前分类按钮
          document.querySelectorAll('.category-btn').forEach(btn => {
            btn.classList.remove('active');
            btn.setAttribute('aria-selected', 'false');
          });
          categoryBtn.classList.add('active');
          categoryBtn.setAttribute('aria-selected', 'true');
        });
        
        categoryNav.appendChild(categoryBtn);
      });
    }
    
    // 滚动到指定分类
    function scrollToCategory(categoryId) {
      const targetElement = document.getElementById(categoryId);
      if (target极Element) {
        const targetPosition = targetElement.offsetTop - 80;
        window.scrollTo({
          top: targetPosition,
          behavior: 'smooth'
        });
      }
    }
    
    // 渲染书签
    function renderBookmarks() {
      if (!bookmarksContainer) return;
      
      bookmarksContainer.innerHTML = '';
      
      bookmarksData.categories.forEach(category => {
        const scrollTarget = document.createElement('div');
        scrollTarget.id = category.id;
        scrollTarget.className = 'scroll-target';
        bookmarksContainer.appendChild(scrollTarget);
        
        // 使用Font Awesome图标
        let categoryIconHtml = '';
        if (category.icon) {
          categoryIconHtml = `<i class="${category.icon}" aria-hidden="true"></i>`;
        } else {
          categoryIconHtml = `<i class="fas fa-folder" aria-hidden="true"></i>`;
        }
        
        const categoryHtml = `
          <section class="category-section ${category.class}" data-category="${category.id}">
            <div class="category-header">
              <h2 class="category-title">
                ${categoryIconHtml}
                ${category.title}
              </h2>
            </div>
            <div class="bookmarks-grid" id="grid-${category.id}">
              ${category.bookmarks.map(bookmark => {
                const icon = createBookmarkIcon(bookmark.title);
                return `
                <a href="${bookmark.url}" class="bookmark-card" target="_blank" rel="noopener" data-url="${bookmark.url}" data-title="${bookmark.title}" aria-label="${bookmark.title} - ${bookmark.desc}">
                  <div class="bookmark-icon" style="background-color: ${icon.bgColor}">
                    ${icon.char}
                  </div>
                  <div class="bookmark-info">
                    <h3 class="bookmark-title">${bookmark.title}</h3>
                    <span class="bookmark-desc">${bookmark.desc}</span>
                  </div>
                </a>
              `}).join('')}
            </div>
          </section>
        `;
        
        bookmarksContainer.innerHTML += categoryHtml;
      });
    }
    
    // 搜索功能
    function filterBookmarks() {
      if (!isInitialized) return;
      
      const searchTerm = searchInput.value.toLowerCase().trim() || 
                         mobileSearchInput.value.toLowerCase().trim();
      
      // 显示加载指示器
      if (loadingIndicator) loadingIndicator.style.display = 'block';
      
      // 使用requestAnimationFrame优化性能
      requestAnimationFrame(() => {
        try {
          // 获取所有书签卡片
          const allCards = document.querySelectorAll('.bookmark-card');
          let foundMatch = false;
          
          // 如果搜索词为空，显示所有卡片
          if (searchTerm === '') {
            allCards.forEach(card => {
              card.style.display = 'flex';
              card.querySelector('.bookmark-title').innerHTML = card.dataset.title;
              card.querySelector('.bookmark-desc').innerHTML = card.querySelector('.bookmark-desc').textContent;
            });
            
            document.querySelectorAll('.category-section').forEach(section => {
              section.style.display = 'block';
            });
            
            if (document.querySelector('.no-results')) {
              document.querySelector('.no-results').remove();
            }
            
            if (loadingIndicator) loadingIndicator.style.display = 'none';
            return;
          }
          
          // 遍历所有卡片进行处理
          allCards.forEach(card => {
            const title = card.dataset.title.toLowerCase() || '';
            const desc = card.querySelector('.bookmark-desc').textContent.toLowerCase() || '';
            
            // 判断是否匹配搜索词
            if (title.includes(searchTerm) || desc.includes(searchTerm)) {
              card.style.display = 'flex';
              
              // 高亮匹配的文本
              const titleEl = card.querySelector('.bookmark-title');
              const descEl = card.querySelector('.bookmark-desc');
              
              // 重置HTML内容
              titleEl.innerHTML = titleEl.textContent;
              descEl.innerHTML = descEl.textContent;
              
              // 高亮匹配
              if (title.includes(searchTerm)) {
                const regex = new RegExp(searchTerm, 'gi');
                titleEl.innerHTML = titleEl.textContent.replace(regex, 
                  match => `<span class="highlight">${match}</span>`);
              }
              
              if (desc.includes(searchTerm)) {
                const regex = new RegExp(searchTerm, 'gi');
                descEl.innerHTML = descEl.textContent.replace(regex, 
                  match => `<span class="highlight">${match}</span>`);
              }
              
              foundMatch = true;
            } else {
              card.style.display = 'none';
            }
          });
          
          // 处理分类可见性
          document.querySelectorAll('.category-section').forEach(section => {
            const visibleCards = section.querySelectorAll('.bookmark-card[style*="flex"]');
            section.style.display = visibleCards.length ? 'block' : 'none';
          });
          
          // 显示"无结果"消息（如果没有匹配项）
          let noResults = document.querySelector('.no-results');
          if (!foundMatch) {
            if (!noResults) {
              noResults = document.createElement('div');
              noResults.className = 'no-results';
              noResults.innerHTML = `
                <i class="fas fa-search" aria-hidden="true"></i>
                <p>没有找到匹配的书签</p>
                <p>请尝试其他搜索关键词</p>
              `;
              if (bookmarksContainer) bookmarksContainer.appendChild(noResults);
            }
          } else {
            // 如果有匹配项，移除"无结果"消息
            if (noResults) {
              noResults.remove();
            }
          }
        } catch (error) {
          console.error('搜索时出错:', error);
        } finally {
          if (loadingIndicator) loadingIndicator.style.display = 'none';
        }
      });
    }
    
    // 处理滚动事件
    function handleScroll() {
      // 清除之前的计时器
      if (scrollTimer) {
        clearTimeout(scrollTimer);
      }
      
      // 显示/隐藏"回到顶部"按钮
      if (backToTop) {
        const showButton = window.scrollY > 300;
        const isHidden = backToTop.classList.contains('hidden');
        
        if (showButton) {
          if (isHidden) {
            backToTop.classList.remove('hidden');
            backToTop.style.display = 'flex';
          }
        } else {
          if (!isHidden) {
            backToTop.classList.add('hidden');
            
            // 设置延迟后完全隐藏以允许动画完成
            scrollTimer = setTimeout(() => {
              backToTop.style.display = 'none';
            }, 300);
          }
        }
      }
      
      // 高亮当前分类
      const sections = document.querySelectorAll('.category-section');
      let currentCategoryId = null;
      
      sections.forEach(section => {
        const rect = section.getBoundingClientRect();
        if (rect.top <= 100 && rect.bottom >= 100) {
          currentCategoryId = section.dataset.category;
        }
      });
      
      // 高亮当前分类按钮
      if (currentCategoryId) {
        document.querySelectorAll('.category-btn').forEach(btn => {
          btn.classList.remove('active');
          btn.setAttribute('aria-selected', 'false');
          if (btn.dataset.category === currentCategoryId) {
            btn.classList.add('active');
            btn.setAttribute('aria-selected', 'true');
          }
        });
      }
    }
    
    // 滚动到顶部
    function scrollToTop() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }
    
    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', initPage);
